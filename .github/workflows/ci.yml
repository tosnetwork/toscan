name: TOSCAN CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: toscan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is deliberately node-independent. Native TOS builds and real-network
# interaction belong to the TOS repository or an explicitly invoked local /
# deployment smoke test, not to TOSCAN pull-request and release gates.

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production configuration contract
        env:
          NODE_ENV: production
          VITE_TOS_NETWORK: mainnet
          VITE_PUBLIC_ORIGIN: https://explorer.example
          VITE_ENABLE_PREVIEW: "false"
          TOS_RPC_UPSTREAM: http://tos-rpc:8011
          TOS_SERVICE_UPSTREAM: http://query:8081
          TOS_SOURCE_EXPLORER: http://tos-service:8080
          DATABASE_URL: postgresql://toscan:ci-only@postgres:5432/toscan
        run: pnpm production:validate
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.query
          push: false
          tags: toscan-query:ci
          cache-from: type=gha,scope=query
          cache-to: type=gha,mode=max,scope=query
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: toscan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  postgres-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toscan
          POSTGRES_PASSWORD: toscan-ci
          POSTGRES_DB: toscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toscan -d toscan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL projection integration
        env:
          QUERY_INTEGRATION_DATABASE_URL: postgresql://toscan:toscan-ci@127.0.0.1:5432/toscan
        run: pnpm test:query:integration

  production-data-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toscan
          POSTGRES_PASSWORD: toscan-ci
          POSTGRES_DB: toscan_gates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toscan -d toscan_gates"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repeated restart, replay and writer-failover gate
        env:
          QUERY_RECOVERY_DATABASE_URL: postgresql://toscan:toscan-ci@127.0.0.1:5432/toscan_gates
        run: pnpm test:query:recovery
      - name: Million-transaction keyset and query-plan gate
        env:
          QUERY_SCALE_DATABASE_URL: postgresql://toscan:toscan-ci@127.0.0.1:5432/toscan_gates
          QUERY_SCALE_ROWS: "1000000"
          QUERY_SCALE_P95_MS: "1000"
        run: pnpm test:query:scale
