name: TOSCAN Release Images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: toscan
            dockerfile: Dockerfile
          - image: toscan-query
            dockerfile: Dockerfile.query
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/tosnetwork/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/tosnetwork/${{ matrix.image }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Sign immutable image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/tosnetwork/${{ matrix.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tosnetwork/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
