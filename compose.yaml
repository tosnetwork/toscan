services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toscan-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-toscan}
    volumes:
      - toscan-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  query:
    build:
      context: .
      dockerfile: Dockerfile.query
    image: toscan-query:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toscan}:${POSTGRES_PASSWORD:-toscan-local-only}@postgres:5432/${POSTGRES_DB:-toscan}
      TOS_RPC_UPSTREAM: ${TOS_RPC_UPSTREAM:-http://host.docker.internal:8011}
      TOS_RPC_API_KEY: ${TOS_RPC_API_KEY:-}
      TOS_SOURCE_EXPLORER: ${TOS_SOURCE_EXPLORER:-http://host.docker.internal:8080}
      QUERY_PROJECT_BATCH: ${QUERY_PROJECT_BATCH:-64}
      QUERY_READY_MAX_LAG: ${QUERY_READY_MAX_LAG:-2}
      QUERY_READY_MAX_STALE_SECONDS: ${QUERY_READY_MAX_STALE_SECONDS:-30}
      QUERY_ASSET_SCAN_BATCH: ${QUERY_ASSET_SCAN_BATCH:-16}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${QUERY_PORT:-8081}:8081"
    restart: unless-stopped

  toscan:
    build:
      context: .
      args:
        VITE_TOS_NETWORK: ${VITE_TOS_NETWORK:-mainnet}
    image: toscan:local
    ports:
      - "4173:8080"
    environment:
      TOS_RPC_UPSTREAM: ${TOS_RPC_UPSTREAM:-http://host.docker.internal:8011}
      TOS_RPC_API_KEY: ${TOS_RPC_API_KEY:-}
      TOS_SERVICE_UPSTREAM: ${TOS_SERVICE_UPSTREAM:-http://query:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      query:
        condition: service_healthy
    restart: unless-stopped

volumes:
  toscan-postgres:
